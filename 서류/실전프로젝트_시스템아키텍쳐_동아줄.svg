<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>동아줄 시스템 아키텍처</title>
  <defs>
    <marker id="b1" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#7c8cf8"/>
    </marker>
    <marker id="b1r" markerWidth="8" markerHeight="8" refX="1" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L8,3 z" fill="#7c8cf8"/>
    </marker>
    <marker id="b2" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#4a5a72"/>
    </marker>
  </defs>

  <rect width="960" height="600" fill="#0f1624" rx="14"/>
  <text x="480" y="34" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#7c8cf8">System Architecture — DONG-A-JUL</text>

  <!-- Client -->
  <rect x="28" y="155" width="118" height="90" rx="10" fill="#1a2535" stroke="#4a5a72" stroke-width="1.5"/>
  <text x="87" y="182" text-anchor="middle" font-family="Arial" font-size="20" fill="#7c8cf8">🖥</text>
  <text x="87" y="204" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#e2e8f0">Web / Mobile</text>
  <text x="87" y="219" text-anchor="middle" font-family="Arial" font-size="9" fill="#a0aec0">Client</text>
  <text x="87" y="234" text-anchor="middle" font-family="Arial" font-size="9" fill="#718096">React Native / Web</text>

  <!-- Frontend -->
  <rect x="192" y="140" width="128" height="118" rx="10" fill="#1a2535" stroke="#7c8cf8" stroke-width="1.8"/>
  <text x="256" y="168" text-anchor="middle" font-family="Arial" font-size="20" fill="#61dafb">⚛</text>
  <text x="256" y="190" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#e2e8f0">Frontend</text>
  <text x="256" y="207" text-anchor="middle" font-family="Arial" font-size="9" fill="#a0aec0">React.js</text>
  <text x="256" y="221" text-anchor="middle" font-family="Arial" font-size="9" fill="#a0aec0">Tailwind CSS</text>
  <text x="256" y="235" text-anchor="middle" font-family="Arial" font-size="9" fill="#a0aec0">Axios</text>
  <text x="256" y="249" text-anchor="middle" font-family="Arial" font-size="9" fill="#718096">REST API</text>

  <!-- Main Backend -->
  <rect x="378" y="68" width="138" height="108" rx="10" fill="#1a2535" stroke="#7c8cf8" stroke-width="1.8"/>
  <text x="447" y="96" text-anchor="middle" font-family="Arial" font-size="20" fill="#68d391">⬡</text>
  <text x="447" y="118" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#e2e8f0">Main Backend</text>
  <text x="447" y="135" text-anchor="middle" font-family="Arial" font-size="9" fill="#a0aec0">Node.js / Express</text>
  <text x="447" y="149" text-anchor="middle" font-family="Arial" font-size="9" fill="#a0aec0">JWT Auth</text>
  <text x="447" y="163" text-anchor="middle" font-family="Arial" font-size="9" fill="#718096">REST API 라우팅</text>

  <!-- OAuth -->
  <rect x="578" y="52" width="128" height="98" rx="10" fill="#1a2535" stroke="#4a5a72" stroke-width="1.5"/>
  <text x="642" y="80" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#e2e8f0">OAuth API</text>
  <text x="642" y="100" text-anchor="middle" font-family="Arial" font-size="10" fill="#f6ad55">● Kakao</text>
  <text x="642" y="116" text-anchor="middle" font-family="Arial" font-size="10" fill="#68d391">● Naver</text>
  <text x="642" y="132" text-anchor="middle" font-family="Arial" font-size="10" fill="#7c8cf8">● Google</text>

  <!-- Service Backend -->
  <rect x="378" y="248" width="138" height="118" rx="10" fill="#1a2535" stroke="#7c8cf8" stroke-width="1.8"/>
  <text x="447" y="276" text-anchor="middle" font-family="Arial" font-size="20" fill="#fc8181">🔷</text>
  <text x="447" y="298" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#e2e8f0">Service Backend</text>
  <text x="447" y="315" text-anchor="middle" font-family="Arial" font-size="9" fill="#a0aec0">FastAPI (Python)</text>
  <text x="447" y="329" text-anchor="middle" font-family="Arial" font-size="9" fill="#a0aec0">임베딩 처리</text>
  <text x="447" y="343" text-anchor="middle" font-family="Arial" font-size="9" fill="#a0aec0">유사도 검색</text>
  <text x="447" y="357" text-anchor="middle" font-family="Arial" font-size="9" fill="#718096">FAISS 인터페이스</text>

  <!-- ML Server -->
  <rect x="578" y="230" width="128" height="118" rx="10" fill="#1a2535" stroke="#7c8cf8" stroke-width="1.8"/>
  <text x="642" y="258" text-anchor="middle" font-family="Arial" font-size="20" fill="#fc8181">🧠</text>
  <text x="642" y="280" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#e2e8f0">ML Server</text>
  <text x="642" y="297" text-anchor="middle" font-family="Arial" font-size="9" fill="#a0aec0">Sentence-BERT</text>
  <text x="642" y="311" text-anchor="middle" font-family="Arial" font-size="9" fill="#a0aec0">UMAP 차원 축소</text>
  <text x="642" y="325" text-anchor="middle" font-family="Arial" font-size="9" fill="#a0aec0">FAISS 인덱싱</text>
  <text x="642" y="339" text-anchor="middle" font-family="Arial" font-size="9" fill="#718096">리스크 스코어링</text>

  <!-- Data Pipeline -->
  <rect x="778" y="230" width="152" height="118" rx="10" fill="#1a2535" stroke="#4a5a72" stroke-width="1.5"/>
  <text x="854" y="258" text-anchor="middle" font-family="Arial" font-size="20" fill="#68d391">📰</text>
  <text x="854" y="280" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#e2e8f0">Data Pipeline</text>
  <text x="854" y="297" text-anchor="middle" font-family="Arial" font-size="9" fill="#a0aec0">Selenium / BS4</text>
  <text x="854" y="311" text-anchor="middle" font-family="Arial" font-size="9" fill="#a0aec0">DBR / HBR 크롤링</text>
  <text x="854" y="325" text-anchor="middle" font-family="Arial" font-size="9" fill="#a0aec0">전처리 / 임베딩 적재</text>
  <text x="854" y="339" text-anchor="middle" font-family="Arial" font-size="9" fill="#718096">~13,000건 기사</text>

  <!-- Database -->
  <rect x="378" y="418" width="328" height="90" rx="10" fill="#1a2535" stroke="#4a5a72" stroke-width="1.5"/>
  <text x="542" y="448" text-anchor="middle" font-family="Arial" font-size="20" fill="#f6ad55">🗄</text>
  <text x="542" y="470" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#e2e8f0">Database</text>
  <text x="542" y="488" text-anchor="middle" font-family="Arial" font-size="9" fill="#a0aec0">MySQL + FAISS Index</text>
  <text x="542" y="502" text-anchor="middle" font-family="Arial" font-size="9" fill="#718096">기사 · 벡터 · 유저 · 구독 데이터</text>

  <!-- ARROWS -->
  <line x1="146" y1="200" x2="192" y2="200" stroke="#7c8cf8" stroke-width="1.5" marker-end="url(#b1)" marker-start="url(#b1r)"/>
  <text x="169" y="192" text-anchor="middle" font-family="Arial" font-size="8" fill="#7c8cf8">REST API</text>

  <path d="M320,183 C348,183 360,140 378,130" stroke="#7c8cf8" stroke-width="1.5" fill="none" marker-end="url(#b1)"/>
  <text x="345" y="148" text-anchor="middle" font-family="Arial" font-size="8" fill="#a0aec0">HTTP/REST (Axios)</text>

  <path d="M320,218 C348,218 360,280 378,295" stroke="#7c8cf8" stroke-width="1.5" fill="none" marker-end="url(#b1)"/>
  <text x="340" y="272" text-anchor="middle" font-family="Arial" font-size="8" fill="#a0aec0">HTTP/REST (Axios)</text>

  <line x1="516" y1="110" x2="578" y2="100" stroke="#4a5a72" stroke-width="1.5" marker-end="url(#b2)"/>
  <line x1="516" y1="300" x2="578" y2="290" stroke="#7c8cf8" stroke-width="1.5" marker-end="url(#b1)"/>
  <line x1="447" y1="366" x2="470" y2="418" stroke="#4a5a72" stroke-width="1.5" marker-end="url(#b2)"/>
  <text x="443" y="398" text-anchor="middle" font-family="Arial" font-size="8" fill="#718096">DB 조회/저장</text>

  <line x1="642" y1="348" x2="590" y2="418" stroke="#4a5a72" stroke-width="1.5" marker-end="url(#b2)"/>
  <line x1="778" y1="280" x2="706" y2="280" stroke="#4a5a72" stroke-width="1.5" marker-end="url(#b2)"/>
  <text x="742" y="272" text-anchor="middle" font-family="Arial" font-size="8" fill="#718096">벡터화</text>

  <path d="M854,348 L854,390 L706,460" stroke="#4a5a72" stroke-width="1.5" fill="none" marker-end="url(#b2)"/>
  <text x="820" y="380" text-anchor="middle" font-family="Arial" font-size="8" fill="#718096">데이터 적재</text>

  <!-- Legend -->
  <rect x="20" y="528" width="920" height="52" rx="8" fill="#141e2e"/>
  <line x1="40" y1="552" x2="64" y2="552" stroke="#7c8cf8" stroke-width="2"/>
  <text x="72" y="556" font-family="Arial" font-size="10" fill="#a0aec0">주요 데이터 흐름 (HTTP/REST)</text>
  <line x1="240" y1="552" x2="264" y2="552" stroke="#4a5a72" stroke-width="2"/>
  <text x="272" y="556" font-family="Arial" font-size="10" fill="#a0aec0">보조 연결 (외부 API / DB)</text>
  <text x="455" y="556" font-family="Arial" font-size="10" fill="#718096">⚛ React  ⬡ Node.js  🔷 FastAPI  🧠 BERT/FAISS  🗄 MySQL  📰 크롤러</text>
  <text x="40" y="572" font-family="Arial" font-size="9" fill="#4a5a72">흐름: Client → Frontend → Main Backend(인증) / Service Backend(AI분석) → ML Server → Database ← Data Pipeline</text>
</svg>
