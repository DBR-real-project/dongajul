version: '3.9'

services:

  # ── AI Server (FastAPI + SBERT + FAISS) ──────────────────────────────────
  ai_server:
    build:
      context: ./ai_server
    container_name: dongajul_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./데이터처리/output:/app/데이터처리/output:ro
    env_file: backend/.env

  # ── Main Backend (Node.js / Express) ─────────────────────────────────────
  backend:
    build: ./backend
    container_name: dongajul_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file: backend/.env
    depends_on:
      - ai_server

  # ── Frontend (React + Vite) ───────────────────────────────────────────────
  # Dockerfile 준비되면 아래 주석 해제
